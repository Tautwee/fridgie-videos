SC.forEach(s=>{(s.ct||[]).forEach(t=>TAPS.push(t));if((s.do||[]).includes('scan'))BEEPS.push(s.start+0.65,s.start+0.85);if(s.notif)DINGS.push(s.start+0.35);if(s.counter)DINGS.push(s.start+s.dur*0.75)});
const $=q=>document.querySelector(q);
let lastPhone=-1;
window.render=function(t){
 const sc=SC.filter(s=>t>=s.start).pop()||SC[0]; const u=t-sc.start; const idx=SC.indexOf(sc);
 const isEnd=sc.type==='end';
 // values
 const g=k=>val(k,t);
 ST.position.x=g('stuX'); const wk=g('walk');
 legL.rotation.x=Math.sin(t*14)*0.6*wk; legR.rotation.x=-Math.sin(t*14)*0.6*wk; ST.position.y=Math.abs(Math.sin(t*14))*0.05*wk;

 armL.rotation.x=-reach*1.3 - eat*1.75 - g('food')*0.7*(1-eat); armL.rotation.z=-reach*0.25 + eat*0.35; armL.rotation.y=0;
 armR.rotation.x=-ph*1.25 - hap*0.15; armR.rotation.z=ph*0.35 + hap*(-0.2+0.25*Math.sin(t*9));
 if(hap>0.5){armR.rotation.x=-2.6*hap+0.3*Math.sin(t*10);armR.rotation.z=-0.3}
 phone.visible=ph>0.02; phone.scale.setScalar(Math.max(0.001,ph)*1.7); phone.rotation.x=1.25*ph;

 // face
 brL.rotation.z=-sad*0.35+sh*0.1; brR.rotation.z=sad*0.35-sh*0.1; brL.position.y=brR.position.y=0.45+sh*0.06+hap*0.02;

 mouthC.scale.set(1-sh*0.2+hap*0.6,1+sh*3.2+hap*0.4,1); mouthC.position.y=0.1-sh*0.05-hap*0.02 + (eat>0.5?Math.abs(Math.sin(t*16))*0.03:0);
 mouthL.position.y=mouthR.position.y=0.12+hap*0.035-sad*0.045; mouthL.position.x=-0.09-hap*0.04;mouthR.position.x=0.09+hap*0.04; mouthL.visible=mouthR.visible=sh<0.5;
 tongue.visible=hap>0.5&&eat<0.5; blush.forEach(b=>b.visible=hap>0.3);
 // fridge
 const dr=g('door'); door.rotation.y=dr*1.95; fl1.intensity=dr*3.2;
 const rot=g('rot'); foods.forEach(m=>{m.material.color.copy(m.userData.c0).lerp(m.userData.rc,rot)});
 stink.forEach((s,i)=>{const ph2=(t*0.5+i/8)%1;s.visible=rot>0.15&&dr>0.3;s.position.set(Math.sin(i*2.1+t)*0.3,0.7+ph2*1.3,0.25+Math.cos(i)*0.1);s.material.opacity=0.6*(1-ph2)*rot;s.rotation.set(t+i,t*1.3,0)});
 flies.forEach((f,i)=>{f.visible=rot>0.4;const a=t*(5+i)+i*1.7;f.position.set(Math.cos(a)*0.45,1.2+Math.sin(a*1.3)*0.5,0.55+Math.sin(a)*0.25)});
 const fm=g('fmood'); fMouthL.position.y=fMouthR.position.y=-0.1+fm*0.06; fMouthC.position.y=-0.12-Math.max(0,fm)*0.02;
 const gl=g('glasses'); glasses.position.y=0.2+(1-back(gl))*1.6; glasses.visible=gl>0.01; fEye.forEach(e=>e.visible=gl<0.6);
 FR.position.y=fm>0.5?Math.abs(Math.sin(t*6))*0.03*fm:0; FR.rotation.z=fm>0.5?Math.sin(t*6)*0.015:0;
 bk.children.forEach(s=>{s.position.y+=0;s.material.opacity=0.22+0.18*Math.sin(t*1.5+s.userData.p)});
 // camera
 const cA=CAMS[(SC[idx-1]||sc).cam||'wide'],cB=CAMS[sc.cam||'wide']; const k=ease(Math.min(1,u/0.6)); const push=1-0.06*Math.min(1,u/sc.dur);
 const L=(a,b)=>a.map((v,i)=>v+(b[i]-v)*k); const p=L(cA[0],cB[0]),l=L(cA[1],cB[1]);
 cam.position.set(l[0]+(p[0]-l[0])*push,l[1]+(p[1]-l[1])*push,l[2]+(p[2]-l[2])*push);
 if(sc.shake&&u<0.4){cam.position.x+=Math.sin(u*90)*0.02*(1-u/0.4)}

 R.render(S,cam);
 // ---------- overlay
 $('#end').style.display=isEnd?'flex':'none';
 if(isEnd){const e=$('#end');const lg=$('#end .lg');lg.style.transform=`scale(${back(u/0.5)}) rotate(${(1-back(u/0.5))*-20}deg)`;
  $('#end .nm').style.transform=`translateY(${(1-ease((u-0.25)/0.4))*80}px)`;$('#end .nm').style.opacity=ease((u-0.25)/0.3);
  $('#end .sl').style.opacity=ease((u-0.55)/0.3);$('#end .pill').style.transform=`scale(${back((u-0.8)/0.45)})`;
  ['#label','#counter','#notif','#chip','#sub'].forEach(q=>$(q).style.display='none');return}
 const lab=$('#label');lab.style.display=sc.label?'flex':'none';if(sc.label){lab.firstChild.innerHTML=sc.label;lab.firstChild.style.transform=`rotate(-1.5deg) scale(${back(u/0.35)})`}
 const cn=$('#counter');cn.style.display=sc.counter?'flex':'none';
 if(sc.counter){const c=sc.counter;cn.querySelector('.l').textContent=c.label;const pr=ease((u-0.3)/(sc.dur*0.6));const v=Math.round(c.from+(c.to-c.from)*pr);
  const n=cn.querySelector('.n');n.textContent=(c.prefix||'€')+v;n.style.color=c.tone==='good'?'#1FAF74':'#e0492f';
  cn.firstChild.style.transform=`scale(${back(u/0.35)*(1+0.06*Math.max(0,1-Math.abs(u-0.3-sc.dur*0.6)*6))})`}

 if(sc.notif){nt.querySelector('.t2').innerHTML=sc.notif;const a=ease((u-0.3)/0.4);nt.style.transform=`translateY(${(1-a)*-500}px)`;nt.style.top=(sc.label?300:220)+(sc.counter?200:0)+'px'}

 const sb=$('#sub');let ci=-1;(sc.ct||[]).forEach((x,i)=>{if(t>=x)ci=i});
 if(ci<0){sb.style.display='none'}else{sb.style.display='block';sb.innerHTML=sc.chunks[ci];const pu=t-sc.ct[ci];sb.style.transform=`scale(${0.6+0.4*back(pu/0.18)})`}
};
