<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Gabarito';font-weight:800;src:url(https://fonts.local/Gabarito-800.woff2) format('woff2')}
@font-face{font-family:'Gabarito';font-weight:600;src:url(https://fonts.local/Gabarito-600.woff2) format('woff2')}
@font-face{font-family:'Atkinson';font-weight:400;src:url(https://fonts.local/AtkinsonHyperlegible-400.woff2) format('woff2')}
@font-face{font-family:'Atkinson';font-weight:700;src:url(https://fonts.local/AtkinsonHyperlegible-700.woff2) format('woff2')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#11213e}
#bg{position:absolute;inset:0;background:#11213e}
#glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 38%,rgba(255,255,255,.10),rgba(255,255,255,0) 70%)}
.head{position:absolute;left:60px;right:60px;top:150px;text-wrap:balance;text-align:center;color:#fff;font-family:Gabarito;font-weight:800;font-size:90px;line-height:1.02;letter-spacing:-1px;text-shadow:0 6px 24px rgba(0,0,0,.25)}
.head b{color:#ffc712;font-weight:800}
.head .sub{display:block;font-family:Atkinson;font-weight:700;font-size:38px;letter-spacing:0;margin-top:22px;opacity:.92}
#phone{position:absolute;left:206px;top:440px;width:668px;height:1416px;border-radius:92px;background:#0b0f19;box-shadow:0 40px 80px rgba(0,0,0,.35),inset 0 0 0 3px #2a3142}
#screen{position:absolute;left:18px;top:18px;width:632px;height:1380px;border-radius:76px;overflow:hidden;background:#f4f3ee}
#app{border:0;width:390px;height:852px;zoom:1.6205;display:block}
#island{position:absolute;left:258px;top:34px;width:152px;height:44px;border-radius:22px;background:#0b0f19;z-index:5}
#tap{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.55);border:6px solid rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(0,0,0,.15);opacity:0;z-index:20;pointer-events:none}
#hl{position:absolute;border:7px solid #ffc712;border-radius:34px;opacity:0;z-index:19;box-shadow:0 0 0 9999px rgba(0,0,0,0);pointer-events:none}
#end{position:absolute;inset:0;background:#11213e;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}
#logo{width:130px;height:200px;margin-bottom:60px}
#end .name{font-family:Gabarito;font-weight:800;font-size:150px;color:#fff;line-height:1;letter-spacing:-2px}
#end .tag{font-family:Gabarito;font-weight:600;font-size:50px;color:#fff;margin-top:40px}
#end .pill{margin-top:62px;background:#ffc712;color:#11213e;font-family:Gabarito;font-weight:800;font-size:52px;padding:30px 50px;border-radius:70px;box-shadow:0 10px 0 #c99608}
#end .small{font-family:Gabarito;font-weight:600;font-size:38px;color:#9cc3f0;margin-top:34px}
</style></head><body>
<div id="bg"></div><div id="glow"></div>
<div class="head" id="h1"></div><div class="head" id="h2"></div>
<div id="phone"><div id="screen"><iframe id="app" src="https://myfridgie.netlify.app/"></iframe></div><div id="island"></div></div>
<div id="hl"></div><div id="tap"></div>
<div id="end">
  <svg id="logo" viewBox="0 0 130 200"><rect x="5" y="5" width="120" height="190" rx="26" fill="#fff"/><rect x="5" y="62" width="120" height="9" fill="#11213e"/><rect x="18" y="17" width="10" height="38" rx="5" fill="#2f55d4"/><path d="M12 100 h106 l-6 22 a12 12 0 0 1 -12 9 h-22 a10 10 0 0 1 -9 -6 l-4 -9 l-4 9 a10 10 0 0 1 -9 6 h-22 a12 12 0 0 1 -12 -9z" fill="#141414"/><rect x="24" y="106" width="20" height="5" rx="2.5" fill="#888"/><path d="M45 148 q20 16 40 0" stroke="#141414" stroke-width="8" fill="none" stroke-linecap="round"/></svg>
  <div class="name">Fridgeroo</div>
  <div class="tag">Your fridge tells you what to eat first.</div>
  <div class="pill">fridgeroo.netlify.app</div>
  <div class="small">Free · no download · any phone</div>
</div>
</body></html>
